<style>:root{--bg:#f4f5f7;--card:#fff;--fg:#111;--fg2:#6e6e73;--line:#00000014;--accent:#0A84FF;--soft:#0A84FF1f;--ok:#34C759;--no:#FF453A}

.fx{height:1.9em;width:auto;max-width:100%;vertical-align:middle;margin:1px 2px;background:#fff;border-radius:4px;padding:1px}

.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:.5rem;align-items:center;padding:.65rem .75rem calc(.65rem + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}

@media (max-width:430px){.bar{gap:.4rem;padding-left:.6rem;padding-right:.6rem}.bar button{padding:.55rem .55rem;font-size:.82rem}.bar .mid{font-size:.78rem}.bar .pdlg{display:none}}

.sheet.on{display:flex}

.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:.6rem}
.gi{border:1px solid var(--line);border-radius:.75rem;height:2.75rem;display:flex;align-items:center;justify-content:center;background:transparent;color:var(--fg);font-size:1rem}
.gi.done{border-color:var(--accent);color:var(--accent);background:var(--soft)}
.gi.right{border-color:var(--ok);background:var(--ok);color:#fff}
.gi.wrong{border-color:var(--no);background:var(--no);color:#fff}

.sheet .foot2{margin-top:.9rem;display:flex;gap:.65rem}

.sheet .foot2 button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.colbtn{margin-top:.9rem;display:flex;flex-direction:column;gap:.55rem}

.colbtn button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.foot{display:flex;align-items:center;justify-content:center;gap:.45rem;color:var(--fg2);font-size:.75rem;margin:1.6rem 0 0;flex-wrap:wrap}
.foot img{width:1rem;height:1rem;background:transparent;padding:0}
.foot b{color:var(--fg)}
.big{font-size:1.9rem;font-weight:700;color:var(--accent);text-align:center;margin:.4rem 0}
.center{text-align:center;color:var(--fg2);font-size:.83rem}
.toast{position:fixed;left:50%;bottom:22%;transform:translateX(-50%) translateY(8px);background:#000000cc;color:#fff;font-size:.9rem;padding:.6rem 1rem;border-radius:.7rem;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}#q{flex:1 1 auto}
.foot{margin-top:auto}
.pfoot{display:none}
.ver{font-size:.7rem;color:var(--fg2);opacity:.75;margin-top:2px}

#pa{display:none}
@page{size:A4;margin:0}

.ptab{border-collapse:collapse;margin:6px 0;font-size:.95em}

.pul{margin:4px 0 4px 1.2em;padding:0}

.ansRow{display:flex;gap:16px;align-items:flex-start}
.ansText{flex:1 1 auto;min-width:0}
.ansTab{flex:0 0 auto}
.pbl{border-bottom:1px solid #333;padding:0 2px}
.pa-ans{color:#000;margin-top:5px}
.pa-anl{color:#555;margin-top:3px}
@media print{
 .bar,.side,.head,.mask,.toast,.sheet,.sbtn,#q,.prog,.foot,.appbar,#appbar{display:none!important}

 body{background:#fff!important;color:#000!important}

<script>window.__KL_OFFLINE__=1;</script>
<script>
function _dz(z){try{return JSON.parse(window.LZString.decompressFromEncodedURIComponent(z));}catch(e){return null;}}
function _dd(b64){b64=b64.replace(/-/g,"+").replace(/_/g,"/");while(b64.length%4){b64+="=";}try{return JSON.parse(decodeURIComponent(escape(atob(b64))));}catch(e){return null;}}
function _fromUrl(u){var hh=(u||"").indexOf("#")>=0?u.slice(u.indexOf("#")):"";var z=hh.match(/z=([^&]+)/);if(z)return _dz(z[1]);var d=hh.match(/d=([^&]+)/);if(d)return _dd(d[1]);return null;}
function _readData(){try{if(window.__KLDATA__&&window.__KLDATA__.questions)return window.__KLDATA__;
var h=(window.__KLHASH__||location.hash||"");var mz=h.match(/z=([^&]+)/);if(mz)return _dz(mz[1]);
var m=h.match(/d=([^&]+)/);if(m){var r0=_dd(m[1]);if(r0)return r0;}
/* 短链：?s=<code> → 向服务器取数据（同步，避免链接过长） */
var sm=(location.search||"").match(/[?&]s=([^&]+)/);
if(sm){try{var c=decodeURIComponent(sm[1]);var y=new XMLHttpRequest();y.open("GET","/api/doc?code="+encodeURIComponent(c),false);y.send(null);var dj=JSON.parse(y.responseText||"{}");if(dj&&dj.ok&&dj.doc){var dq=null;try{dq=JSON.parse(dj.doc);}catch(e2){}if(dq)return dq;}}catch(e){}
try{var x=new XMLHttpRequest();x.open("GET","/api/resolve?code="+encodeURIComponent(decodeURIComponent(sm[1])),false);x.send(null);var j=JSON.parse(x.responseText||"{}");if(j&&j.url)return _fromUrl(j.url);}catch(e){}}
return null;}catch(e){return null;}}
var DATA=_readData();
if(DATA&&!DATA.logo){DATA.logo="/logo-line.png";}
if(!DATA){DATA={title:"Knowlib 试卷",total:0,used:"",logo:"/logo-line.png",questions:[]};
document.addEventListener("DOMContentLoaded",function(){var q=document.getElementById("q");
if(q)q.innerHTML="<div class='card'><div class='stem'>链接里没有题目数据，请检查链接是否完整～</div></div>";});}
;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function openImg(src){var d=document.createElement('div');d.className='imgmask';var im=document.createElement('img');im.src=src;d.appendChild(im);d.addEventListener('click',function(){document.body.removeChild(d);});document.body.appendChild(d);}
/* 标题去掉「含答案」之类的后缀（导空白卷时不应写“含答案”） */
function cleanTitle(s){
  var t=String(s==null?'':s);
  t=t.replace(/【[^】]*】/g,function(m){return /含答案|带答案|答案版/.test(m)?'':m;});
  t=t.replace(/[（(][^）)]*[）)]/g,function(m){return /含答案|带答案|答案版/.test(m)?'':m;});
  t=t.replace(/(含答案版|含答案|带答案)$/,'');
  return t.trim();
}
var Q=DATA.questions,i=0,ans={},revealed=false,submitted=false,shown={},toastTimer=null;
/* 本地记住作答进度（同一链接下次打开可续答） */
var _pk='knowlib.p.'+(function(s){var x=0;for(var k=0;k<s.length;k++){x=(x*31+s.charCodeAt(k))|0;}return Math.abs(x).toString(36);})(window.__KLHASH__||(window.__KLDATA__?location.pathname:location.hash)||'');
(function(){try{var p=JSON.parse(localStorage.getItem(_pk)||'null');if(p){if(typeof p.i==='number')i=p.i;if(p.ans)ans=p.ans;if(p.shown)shown=p.shown;}}catch(e){}})();
function _saveP(){try{localStorage.setItem(_pk,JSON.stringify({i:i,ans:ans,shown:shown}));}catch(e){}}
function toast(msg){
  var t=document.getElementById('toast');if(!t)return;
  t.textContent=msg;t.classList.add('on');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('on');},1600);
}
function normAns(s){return String(s==null?'':s).replace(/s+/g,'').replace(/[、|｜,，;；。.]/g,'').toLowerCase();}
function auto(q){return q.type==='choice'||q.type==='judge'||(q.type==='blank'&&String(q.answer==null?'':q.answer).trim()!=='');}
function okOf(q,k){ if(!auto(q))return false; if(q.type==='blank'){var u=normAns(ans[k]);return u!==''&&u===normAns(q.answer);} return ans[k]===q.answer; }
function render(){
  document.title=cleanTitle(DATA.title);
  document.getElementById('t').textContent=cleanTitle(DATA.title);
  document.getElementById('m').textContent='共 '+Q.length+' 题 · 总分 '+DATA.total+' 分';
  var q=Q[i];
  document.getElementById('pn').textContent='第 '+(i+1)+' / '+Q.length+' 题';
  document.getElementById('ps').textContent='本题 '+q.score+' 分';
  document.getElementById('cnt').textContent=(i+1)+'/'+Q.length;
  var h='<div class="card"><span class="chip">'+esc(q.typeName)+'</span><div class="stem">'+q.stem+'</div>';
  if(q.img){h+='<img class="qimg'+((q.imgH>0&&q.imgW/q.imgH<0.85)?' tall':'')+(String(q.img).indexOf('data:image/png')===0?' png':'')+'" src="'+q.img+'" alt="">';}
  var rv=revealed||shown[i]||submitted;
  if(q.type==='choice'){
    h+='<div class="opts">';
    q.options.forEach(function(o){
      var cls='opt';if(ans[i]===o.label)cls+=' sel';
      if(rv){ if(o.label===q.answer)cls='opt right'; else if(ans[i]===o.label&&ans[i]!==q.answer)cls='opt wrong'; }
      h+='<div class="'+cls+'" data-l="'+esc(o.label)+'"><b>'+esc(o.label)+'</b><span>'+o.text+'</span></div>';
    });
    h+='</div>';
  }else if(q.type==='judge'){
    h+='<div class="opts">';
    ['对','错'].forEach(function(v){
      var cls='opt';if(ans[i]===v)cls+=' sel';
      if(rv){ if(v===q.answer)cls='opt right'; else if(ans[i]===v&&ans[i]!==q.answer)cls='opt wrong'; }
      h+='<div class="'+cls+'" data-l="'+v+'"><b>'+v+'</b><span>'+(v==='对'?'正确':'错误')+'</span></div>';
    });
    h+='</div>';
  }else if(q.type==='blank'){
    h+='<input class="binput" id="ta" autocomplete="off" placeholder="填写答案（自动判分）" />';
  }else{
    h+='<textarea class="ta" id="ta" placeholder="在这里作答（本地记录，不会判分）"></textarea>';
  }

/* 导出 PDF：先问“要不要答案&解析”，再把整卷写进 #pa，调起浏览器打印 → 另存为 PDF */
/* 选项横向排版：四步法定宽度（中文≈16px、英数≈9px） */
function paPlain(s){return String(s==null?'':s).replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/g,'x');}
function paWpx(s){var t=paPlain(s),w=0;for(var i=0;i<t.length;i++){w+=(t.charCodeAt(i)>127?16:9);}return w;}
function paOpts(q){
  var opts=q.options||[],h='',maxw=0;
  opts.forEach(function(o){var w=paWpx(o.label+'. '+o.text);if(w>maxw)maxw=w;});
  if(maxw>250||opts.length===0){
    opts.forEach(function(o){h+='<div class="po"><b>'+esc(o.label)+'</b>. '+o.text+'</div>';});
    return h;
  }
  var cw=(maxw<=110)?110:250, per=(maxw<=110)?4:2;
  for(var i=0;i<opts.length;i+=per){
    h+='<div class="prow">';
    for(var j=i;j<i+per&&j<opts.length;j++){
      var o=opts[j];
      h+='<span class="pcell" style="width:'+cw+'px"><b>'+esc(o.label)+'</b>. '+o.text+'</span>';
    }
    h+='</div>';
  }
  return h;
}
/* 把答案 HTML 拆成「文字部分」与「表格部分」，表格单独放右侧与文字并排 */
function ansSplit(html){
  var tabs=[],text='',pos=0,startTag='<table class="ptab">',endTag='</table>';
  while(true){
    var a=html.indexOf(startTag,pos);
    if(a<0){text+=html.slice(pos);break;}
    text+=html.slice(pos,a);
    var b=html.indexOf(endTag,a);
    if(b<0){text+=html.slice(a);break;}
    tabs.push(html.slice(a,b+endTag.length));
    pos=b+endTag.length;
  }
  return {text:text,tabs:tabs};
}
function paOf(q,k,withAns){
  var stem=q.stem;
  if(withAns){
    if(q.type==='choice'){
      // 选择题：答案直接填进题干括号
      stem=stem.replace(/[（(][　 ]*[）)]/g,'（'+esc(q.answer)+'）');
    }else if(q.type==='blank'){
      // 填空题：答案依次填进空里
      var arr=String(q.answer).split(/[、|｜,，;；]+/).filter(function(x){return x!=='';});
      var bi=0;
      stem=stem.replace(/＿+/g,function(){var v=arr[bi];bi++;return (v===undefined)?'＿＿＿':('<span class="pbl"><b>'+esc(v)+'</b></span>');});
    }
  }
  var body='<div><b>'+(k+1)+'.</b> '+stem+'</div>';
  if(q.type==='choice'||q.type==='judge'){body+=paOpts(q);}
  var tail='';
  if(withAns){
    if(q.type==='short'||q.type==='calc'||q.type==='judge'){
      var aHtml=(q.answerMd!==undefined?q.answerMd:esc(q.answer));
      var sp=ansSplit(aHtml);
      if(sp.tabs.length>0&&sp.text.trim()!==''){
        tail+='<div class="ansRow"><div class="ansText">参考答案：'+sp.text+'</div><div class="ansTab">'+sp.tabs.join('')+'</div></div>';
      }else{
        tail+='<div class="pa-ans">参考答案：'+aHtml+'</div>';
      }
    }
    if(q.analysis){tail+='<div class="pa-anl">解析：'+q.analysis+'</div>';}
  }
  var headHtml='<div class="pq '+(tail===''?'pqend':'pqh')+'">'+body+'</div>';
  var tailHtml=(tail==='')?'':('<div class="pq pqt">'+tail+'</div>');
  return {head:headHtml,tail:tailHtml};
}
function paTypeName(t){if(t==='choice')return '选择题';if(t==='blank')return '填空题';if(t==='judge')return '判断题';if(t==='short')return '简答题';if(t==='calc')return '计算题';return '题目';}
var PA_TYPE_ORDER=['choice','blank','judge','short','calc'];
/* 把版面手动分成 A4 页，每页底部写 “页码/总页数” */
function buildPrintPages(blocks){
  var pa=document.getElementById('pa');
  var rootEl=document.documentElement;
  var oldRootF=rootEl.style.fontSize;
  rootEl.style.fontSize='18px';   // 与打印时的根字号保持一致，否则量出来的高度不准
  pa.innerHTML=blocks.join('');
  var oldD=pa.style.display,oldP=pa.style.position,oldL=pa.style.left,oldT=pa.style.top,oldW=pa.style.width;
  pa.style.display='block';pa.style.position='absolute';pa.style.left='-10000px';pa.style.top='0';pa.style.width='658px';
  renderMath();
  var kids=Array.prototype.slice.call(pa.children);
  var paTop=pa.getBoundingClientRect().top;
  var tops=[],hs=[];
  for(var q0=0;q0<kids.length;q0++){
    var rr=kids[q0].getBoundingClientRect();
    tops.push(rr.top-paTop);hs.push(rr.height);
  }
  var spans=[];
  for(var q1=0;q1<kids.length;q1++){
    spans.push((q1+1<kids.length)?(tops[q1+1]-tops[q1]):hs[q1]);
  }
  var avail=1000;
  var pages=[],cur=[],curH=0;
  for(var q2=0;q2<kids.length;q2++){
    var h=spans[q2];
    // 题型小节（标题+首题）要留足位置再放；普通题不要挤在页脚
    var need=(kids[q2].className.indexOf('pgrp')>=0)?360:84;
    if(cur.length>0&&(curH+h>avail||(avail-curH)<need)){pages.push(cur);cur=[];curH=0;}
    cur.push(kids[q2]);curH+=h;
  }
  if(cur.length){pages.push(cur);}
  var total=pages.length;
  var FOOT='本网页由 Knowlib 生成 · 由 ChingYu 和小团 共同开发';
  var html='';
  for(var p=0;p<pages.length;p++){
    var inner='';
    for(var j=0;j<pages[p].length;j++){inner+=pages[p][j].outerHTML;}
    html+='<div class="ppage">'+inner+'<div class="pfoot2"><span>'+esc(FOOT)+'</span><span>'+(p+1)+'/'+total+'</span></div></div>';
  }
  pa.style.display=oldD;pa.style.position=oldP;pa.style.left=oldL;pa.style.top=oldT;pa.style.width=oldW;
  rootEl.style.fontSize=oldRootF;
  pa.innerHTML=html;
  renderMath();
}
function exportPdf(withAns){
  var blocks=[];

function renderMathIn(el){
  if(!window.katex){return;}
  var walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,null);
  var nodes=[],n;
  while((n=walker.nextNode())!==null){
    var pn=n.parentNode;
    if(!pn){continue;}
    var tn=pn.nodeName;
    if(tn==='SCRIPT'||tn==='STYLE'||tn==='TEXTAREA'){continue;}
    if(pn.closest&&pn.closest('.katex')){continue;}
    var v=n.nodeValue;
    if(v&&(v.indexOf('$')>=0||v.indexOf('\\(')>=0||v.indexOf('\\[')>=0)){nodes.push(n);}
  }
  for(var i=0;i<nodes.length;i++){
    var t=nodes[i],str=t.nodeValue,re=/\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*?[^\s$])?)\$/g,m,html='',last=0,ok=false;
    re.lastIndex=0;
    while((m=re.exec(str))!==null){
      ok=true;
      html+=esc(str.substring(last,m.index));
      var display=(m[1]!==undefined||m[2]!==undefined);
      var tex=(m[1]!==undefined)?m[1]:(m[2]!==undefined?m[2]:(m[3]!==undefined?m[3]:m[4]));
      try{html+=window.katex.renderToString(tex,{displayMode:display,throwOnError:false});}
      catch(e){html+=esc(m[0]);}
      last=m.index+m[0].length;
    }
    if(ok){
      html+=esc(str.substring(last));
      var w=document.createElement('span');
      w.innerHTML=html;
      t.parentNode.replaceChild(w,t);
    }
  }
}
function renderMath(){try{renderMathIn(document.body);}catch(e){}}

    try{

        try{
          if(window.auto && window.auto(q)) return;

      ]);

    var total=0;
    (window.Q||[]).forEach(function(q,k){
      try{
        if(window.auto && window.auto(q)){
          if(window.okOf && window.okOf(q,k)) total += Number(q.score||0);

      });

        + '<div id="covBy" style="margin-top:.15rem;font-size:.8rem;color:var(--fg2,#6e6e73)"></div>'
        + '<div id="covMode" style="display:flex;gap:.5rem;margin-top:.85rem"></div>'
        + '<div id="covTip" style="margin-top:.7rem;font-size:.8rem;line-height:1.6;background:#0A84FF14;color:#0A84FF;padding:.55rem .7rem;border-radius:.65rem"></div>'
        + '<div id="covByok" style="margin-top:.6rem;font-size:.78rem;color:#0A84FF;text-decoration:underline;cursor:pointer"></div>'
        + '<div id="covBean" style="margin-top:.4rem;font-size:.78rem;color:#0A84FF;text-decoration:underline;cursor:pointer">豆子：加载中…</div>'
        + '<div id="covBtnRow" style="margin-top:1rem">'
        + '<button id="covGo" style="width:100%;padding:.85rem;border-radius:.8rem;background:#0A84FF;color:#fff;border:none;font-size:1rem;font-weight:700">开始答题</button>'
        + '<button id="covResume" style="display:none;width:100%;margin-top:.5rem;padding:.72rem;border-radius:.8rem;background:var(--card,#fff);border:1px solid var(--line,#00000014);color:var(--fg,#111);font-size:.9rem"></button>'
        + '</div>'
        + '<div style="margin-top:.7rem;text-align:center;font-size:.72rem;color:#8a93a6">由 Knowlib 生成 · 作答记录保存在本机浏览器</div>'
        + '</div>';

      document.body.appendChild(cov);
      var bt=document.getElementById('boot'); if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
      // 封面期间隐藏答题栏和页面内容，避免闪一下
      var bar=document.querySelector('.bar'); if(bar) bar.style.display='none';
      var wrap=document.querySelector('.wrap'); if(wrap) wrap.style.visibility='hidden';

      document.getElementById('covT').textContent=(d.title||'在线试卷').replace(/^Knowlib\s*试卷\s*/,'')||'在线试卷';
      document.getElementById('covM').innerHTML =
        '共 <b>'+Q.length+'</b> 题 · 总分 <b>'+(d.total||0)+'</b> 分'
        + (d.used?(' · 建议用时 '+d.used):'')
        + '<br>题型：'+typeStr;
      // 出卷人署名
      var byName=String(d.author||d.by||'').trim();
      document.getElementById('covBy').textContent = byName ? ('出卷人：'+byName) : '';

      var forced = !!(d.exam && d.exam.enabled);
      if (forced) { MODE = 'exam'; }
      function paintModeBtns(){
        var box=document.getElementById('covMode'); if(!box) return;
        box.innerHTML='';
        var kinds=[['practice','练习模式'],['exam','考试模式']];
        kinds.forEach(function(k){
          var on=(MODE===k[0]);
          var b=document.createElement('button');
          b.textContent=k[1];
          b.disabled=forced;
          b.style.cssText='flex:1;padding:.55rem .6rem;border-radius:.7rem;font-size:.86rem;cursor:pointer;'
            + (on? 'background:#0A84FF;border:1px solid #0A84FF;color:#fff;font-weight:700'
                 : 'background:transparent;border:1px solid var(--line,#00000014);color:var(--fg,#111)')
            + (forced? ';opacity:.55;cursor:not-allowed':'');
          b.onclick=function(){
            if(forced) return;
            MODE=k[0];
            try{ localStorage.setItem('knowlib.qmode',MODE); }catch(e){}
            paintTip(); paintModeBtns();

          };
          box.appendChild(b);
        });
      }
      function paintTip(){
        var t=document.getElementById('covTip');
        if(forced){
          var st=d.exam.startAt||0, en=d.exam.endAt||0;
          var tf=function(x){ if(!x) return ''; var dd=new Date(x); var pp=function(n){return n<10?'0'+n:''+n;}; return (dd.getMonth()+1)+'/'+dd.getDate()+' '+pp(dd.getHours())+':'+pp(dd.getMinutes()); };
          t.textContent='考试模式：'+ (st||en ? ('考试时间 '+tf(st)+' ~ '+tf(en)+'，') : '') +'作答中不显示答案，交卷后统一给分。';
        }else{
          t.textContent=(MODE==='exam')
            ? '考试模式：作答过程中不显示答案，交卷后统一给出答案与解析。'
            : '练习模式：每道题做完可以立即看答案与解析。';
        }
      }
      paintTip(); paintModeBtns();

      // 豆子入口
      try{
        var cb=document.getElementById('covBean');
        if(cb){
          var uid0=dv();
          cb.onclick=function(){ openBeans(); };
          if(uid0){
            fetch('/api/quiz/balance?uid='+encodeURIComponent(uid0),{cache:'no-store'})
              .then(function(r){return r.json();})
              .then(function(j){
                if(j&&j.ok){ cb.textContent='豆子：'+(j.total||0)+' 个（点击充值 / 兑换）'; }
                else { cb.textContent='豆子：未开通（点击查看）'; }
              }).catch(function(){ cb.textContent='豆子：—（点击查看）'; });
          }
        }
      }catch(e){}

      // ===== 考试状态（时间窗 / 已交卷）=====
      try{
        var exCfg = (EX && EX.exam) ? EX.exam : ((d && d.exam) ? d.exam : null);
        if(exCfg){
          MODE='exam';
          try{ localStorage.setItem('knowlib.qmode','exam'); }catch(e){}
          paintModeBtns(); paintTip();
          var st=Number(exCfg.startAt||0), en=Number(exCfg.endAt||0), now=Date.now();
          var tip=document.getElementById('covTip');
          var goBtn=document.getElementById('covGo');
          var resumeBtn=document.getElementById('covResume');

          // 统一入口：进答题前再查一次是否已交卷
          var tryEnter = function(){
            var gb=document.getElementById('covGo');
            if(gb) gb.disabled=true;
            (async function(){
              var ok=false;
              try{
                var j3=await (await fetch('/api/exam-status?code='+encodeURIComponent(quizCode())+'&uid='+encodeURIComponent(dv()),{cache:'no-store'})).json();
                if(j3 && j3.ok && j3.submitted){
                  showScore(Number(j3.score||0), Number(j3.ts||Date.now()), false);
                  if(gb) gb.disabled=false;
                  return;
                }
                ok=true;
              }catch(e){ ok=true; }
              if(gb) gb.disabled=false;
              if(ok){ closeCover(); try{ window.render && window.render(); }catch(e){} }
            })();
          };
          if(EX && EX.submitted){
            if(resumeBtn) resumeBtn.style.display='none';
            if(goBtn){
              goBtn.textContent='查看分数';
              goBtn.onclick=function(){
                var en2=Number((EX && EX.exam ? EX.exam : exCfg).endAt||0), now2=Date.now();
                var inWindow = (en2===0 || now2<=en2);
                showScore(Number(EX.score||0), Number(EX.ts||Date.now()), !inWindow);
              };
            }
            if(tip) tip.textContent='你已交卷：'+Number(EX.score||0)+' 分。考试时间内不能重新作答。';
          } else if(st>0 && now<st){
            if(goBtn){ goBtn.disabled=true; goBtn.style.opacity='.5'; goBtn.style.cursor='not-allowed'; goBtn.textContent='考试未开始'; }
            if(resumeBtn) resumeBtn.style.display='none';
            if(tip){
              var pad2=function(n){ return n<10 ? ('0'+n) : (''+n); };
              var tmStart=null;
              var tickStart=function(){
                var left=st-Date.now();
                if(left<=0){
                  tip.textContent='考试已开始，可以进入作答了';
                  var gb2=document.getElementById('covGo');
                  if(gb2){ gb2.disabled=false; gb2.style.opacity='1'; gb2.style.cursor='pointer'; gb2.textContent='开始答题'; gb2.onclick=tryEnter; }
                  if(tmStart) clearInterval(tmStart);
                  return;
                }
                var hh=Math.floor(left/3600000), mm=Math.floor((left%3600000)/60000), ss=Math.floor((left%60000)/1000);
                tip.innerHTML='考试将于 '+fmtTs(st)+' 开始，距开考还有 <b style="color:#0A84FF">'+pad2(hh)+':'+pad2(mm)+':'+pad2(ss)+'</b>';
              };
              tickStart();
              tmStart=setInterval(tickStart, 1000);
            }
          } else if(en>0 && now>en){
            if(goBtn){ goBtn.textContent='考试已结束 · 转为练习'; }
            if(tip) tip.textContent='考试已于 '+fmtTs(en)+' 结束，可自由练习本题。';
            var oldGo=goBtn.onclick;
            goBtn.onclick=function(){ MODE='practice'; try{ localStorage.setItem('knowlib.qmode','practice'); }catch(e){}; closeCover(); try{ window.render && window.render(); }catch(e){} };
          } else {
            if(tip) tip.textContent='考试模式：'+fmtTs(st)+' ~ '+fmtTs(en)+'，作答中不显示答案，交卷后统一给分。';
            // 点“开始答题”前再查一次是否已交卷（防止绕过封面）
            if(goBtn){
              goBtn.onclick=async function(){
                goBtn.disabled=true;
                var go=false;
                try{
                  var j2=await (await fetch('/api/exam-status?code='+encodeURIComponent(quizCode())+'&uid='+encodeURIComponent(dv()),{cache:'no-store'})).json();
                  if(j2 && j2.ok && j2.submitted){
                    showScore(Number(j2.score||0), Number(j2.ts||Date.now()), false);
                    goBtn.disabled=false;
                    return;
                  }
                  go=true;
                }catch(e){ go=true; }
                goBtn.disabled=false;
                if(go){ closeCover(); try{ window.render && window.render(); }catch(e){} }
              };
            }
          }
        }
      }catch(e){}

      // 自带 Key 入口
      try{
        var bk=document.getElementById('covByok');
        if(bk){
          var cur=null; try{ cur=JSON.parse(localStorage.getItem('knowlib.byok')||'null'); }catch(e){}
          bk.textContent = (cur && cur.key) ? '当前：使用你自己的 AI Key（不扣豆）· 点击修改' : '使用自己的 AI Key（不扣豆）';
          bk.onclick=function(){ openByok(); };
        }
      }catch(e){}

      var resume=document.getElementById('covResume');
      if(hasProg && typeof saved.i==='number'){
        resume.style.display='block';
        resume.textContent='继续上次进度（第 '+(saved.i+1)+' 题）';
        resume.onclick=function(){
          try{ window.i=saved.i; }catch(e){}
          closeCover(); try{ window.render && window.render(); }catch(e){}
        };
      }

      document.getElementById('covGo').onclick=function(){
        // 从头开始：清掉作答
        try{ window.ans={}; window.shown={}; window.revealed=false; window.submitted=false; window.i=0; localStorage.removeItem(window._pk); }catch(e){}
        closeCover(); try{ window.render && window.render(); }catch(e){}
      };
    }catch(e){}
  }

  function closeCover(){
    var cov=document.getElementById('cov'); if(cov && cov.parentNode) cov.parentNode.removeChild(cov);
    var bar=document.querySelector('.bar'); if(bar) bar.style.display='';
    var wrap=document.querySelector('.wrap'); if(wrap) wrap.style.visibility='';
    var ph=document.getElementById('preCov'); if(ph) ph.remove();
    window.scrollTo(0,0);
  }

  var MODE = (function(){ try{ return localStorage.getItem('knowlib.qmode')==='exam' ? 'exam' : 'practice'; }catch(e){ return 'practice'; } })();

  function modeChip(){
    try{
      var m=document.getElementById('m'); if(!m) return;
      var b=document.getElementById('modeChip');
      if(!b){
        b=document.createElement('span');
        b.id='modeChip';
        b.style.cssText='margin-left:.6rem;padding:.12rem .5rem;border-radius:.5rem;background:#0A84FF1a;color:#0A84FF;font-size:.78rem;cursor:pointer;white-space:nowrap';
        b.onclick=function(){
          MODE=(MODE==='exam')?'practice':'exam';
          try{ localStorage.setItem('knowlib.qmode',MODE); }catch(e){}
          b.textContent=(MODE==='exam')?'考试模式':'练习模式';
          try{ window.render && window.render(); }catch(e){}
        };
        m.appendChild(b);
      }
      b.textContent=(MODE==='exam')?'考试模式':'练习模式';
    }catch(e){}
  }

  function applyMode(){
    try{
      try{
        if(examActive()){
          var en1=Number((EX.exam||{}).endAt||0);
          if(en1 === 0 || Date.now() <= en1){
            var rc=document.getElementById('rClose'); if(rc) rc.style.display='none';
            var rt=document.getElementById('rRetry'); if(rt) rt.style.display='none';
          }
        }
      }catch(e){}
      if((MODE==='exam' || examActive()) && !window.revealed){
        var sb=document.getElementById('sub1'); if(sb) sb.style.display='none';
        var an=document.getElementById('ans'); if(an) an.style.display='none';
      }
      modeChip();
    }catch(e){}
  }

  function decorate(){
    try{
      var q=(window.Q||[])[window.i];
      var box=document.getElementById('q');
      if(!q||!box) return;
      var old=document.getElementById('aiBox'); if(old) old.parentNode.removeChild(old);
      var res=window.__aiScores[window.i];
      if(!res) return;
      var d=document.createElement('div');
      d.id='aiBox';
      d.style.cssText='margin-top:.6rem;padding:.6rem .75rem;border-radius:.7rem;background:#0A84FF14;font-size:.85rem;line-height:1.6';
      d.innerHTML='<b style="color:#0A84FF">AI 判分：'+res.score+' / '+q.score+' 分</b>'
        + (res.comment?('<div style="margin-top:.25rem;color:#3a4a63">'+res.comment+'</div>'):'');
      box.appendChild(d);
    }catch(e){}
  }

  // 包一层 render，保证切题后判分卡片还在
  try{
    var orig=window.render;
    if(typeof orig==='function' && !orig.__aiWrapped){
      var wrapped=function(){ var r=orig.apply(null, arguments); try{ decorate(); }catch(e){} try{ applyMode(); }catch(e){} try{ fixPlaceholder(); }catch(e){} return r; };
      wrapped.__aiWrapped=true;
      window.render=wrapped;
    }
  }catch(e){}

  var NO_MORE_BEANS = false;

  // 把界面上当前输入框的内容同步进 ans（防止最后一次输入没同步）
  function pullAnswer(){
    try{
      var ta=document.getElementById('ta');
      if(ta && typeof window.i === 'number'){
        window.ans = window.ans || {};
        window.ans[window.i] = ta.value;
      }
      try{ if(window._saveP) window._saveP(); }catch(e){}
    }catch(e){}
  }

  async function gradeOne(k){
    pullAnswer();
    if (NO_MORE_BEANS) return false;
    var uid = dv(); if (!uid) return false;
    var q = (window.Q||[])[k]; if (!q) return false;
    var a = (window.ans||{})[k];
    if (a === undefined || a === null || String(a).trim() === '') return false;
    try{
      var SYS = '你是严谨的阅卷老师。只输出一个 JSON 对象：{"score":数字,"comment":"30字以内评语"}，不要输出任何其它内容。';
      var PROMPT = '题目：'+strip(q.stem)+'\n参考答案：'+strip(q.answer||'')+'\n本题满分：'+q.score+' 分\n学生作答：'+String(a).slice(0,1500);
      var byok = null;
      try{ byok = JSON.parse(localStorage.getItem('knowlib.byok')||'null'); }catch(e){}
      var useByok = !!(byok && byok.key);
      var resp = await fetch(useByok ? '/api/ai-byok' : '/api/quiz/ai', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify(useByok
          ? { key: byok.key, baseUrl: byok.baseUrl||'', model: byok.model||'', systemPrompt: SYS, prompt: PROMPT }
          : { userId: uid, mode: 'grade', purpose: 'web_grade', systemPrompt: SYS, prompt: PROMPT })
      });
      var j = await resp.json();
      if (!j || !j.ok){
        if (j && (j.code === 'NO_BEANS' || j.code === 'NO_MORE_BEANS')){
          NO_MORE_BEANS = true;
          showQuotaBanner();
          toast2('免费 AI 额度已用完，后续题目不再自动判分');
        }
        return false;
      }
      var BT = String.fromCharCode(96);
      var txt = String(j.text||'').replace(new RegExp(BT+BT+BT+'json','gi'),'').replace(new RegExp(BT+BT+BT,'g'),'').trim();
      var m = txt.match(/\{[\s\S]*\}/);
      var o = m ? JSON.parse(m[0]) : {score:0, comment:''};
      var sc = Number(o.score); if (isNaN(sc)) sc = 0;
      sc = Math.max(0, Math.min(Number(q.score)||0, sc));
      window.__aiScores[k] = {score: sc, comment: String(o.comment||'').slice(0,120)};
      return true;
    }catch(e){ return false; }
  }

  async function autoGradeAll(){
    pullAnswer();
    var ks = [];
    (window.Q||[]).forEach(function(q,k){
      try{ if (window.auto && window.auto(q)) return; }catch(e){}
      var a = (window.ans||{})[k];
      if (a === undefined || a === null || String(a).trim() === '') return;
      if (window.__aiScores && window.__aiScores[k]) return;
      ks.push(k);
    });
    for (var n=0; n<ks.length; n++){
      var ok = await gradeOne(ks[n]);
      if (!ok && NO_MORE_BEANS) break;
    }
    try{ window.render && window.render(); }catch(e){}
  }

  // 点「提交本题/看答案」→ 自动判这道；点「确定交卷」→ 补判全卷
  document.addEventListener('click', function(e){
    var t = e.target; if (!t || !t.id) return;
    if ((t.id === 'rClose' || t.id === 'rRetry') && examActive()){
      try{
        var en0=Number((EX.exam||{}).endAt||0);
        if (en0 === 0 || Date.now() <= en0){
          if (e.stopPropagation) e.stopPropagation();
          if (e.preventDefault) e.preventDefault();
          toast2('考试已交卷，考试时间内不能重新作答或查看解析');
          return;
        }
      }catch(err){}
    }
    if (t.id === 'sub1'){
      setTimeout(function(){
        try{
          var q = (window.Q||[])[window.i];
          if (q && !(window.auto && window.auto(q))) { gradeOne(window.i); }
        }catch(err){}
      }, 60);
    } else if (t.id === 'askYes'){
      pullAnswer();
      setTimeout(function(){
        try{ if(examActive() && !(EX && EX.submitted)){ finishExam(); return; } }catch(e){}
        autoGradeAll();
      }, 200);
    }
  }, true);

  // 输入即保存（每题都落本地，保证“继续上次进度”是准的）
  try{
    document.addEventListener('input', function(){ try{ pullAnswer(); }catch(e){} }, true);
    document.addEventListener('change', function(){ try{ pullAnswer(); }catch(e){} }, true);
    window.addEventListener('beforeunload', function(){ try{ pullAnswer(); }catch(e){} });
    document.addEventListener('visibilitychange', function(){ if(document.hidden){ try{ pullAnswer(); }catch(e){} } });
  }catch(e){}

  // 作答框提示：改成 AI 判分
  function fixPlaceholder(){
    var ta = document.getElementById('ta');
    if (ta){
      var ph = ta.getAttribute('placeholder') || '';
      if (ph.indexOf('不会判分') >= 0) { ta.setAttribute('placeholder','在这里作答（提交后 AI 判分）'); }
    }
  }

  // 直接接管页面自带的「交卷」函数（兜底，防止点击监听没生效）
  try{
    if(typeof window.doSubmit === 'function' && !window.doSubmit.__klWrapped){
      var _origSubmit = window.doSubmit;
      var _wrapped = function(){
        var r = _origSubmit.apply(null, arguments);
        try{ if(examActive()){ setTimeout(function(){ finishExam(); }, 400); } }catch(e){}
        return r;
      };
      _wrapped.__klWrapped = true;
      window.doSubmit = _wrapped;
    }
  }catch(e){}

  // 自测开关：?kltest=1 → 自动进入、填答案、交卷（只为开发验证）
  try{
    if(location.search.indexOf('kltest=1') >= 0){
      setTimeout(function(){
        try{
          var g=document.getElementById('covGo');
          if(g) g.click();
          setTimeout(function(){
            try{
              var Q=window.Q||[];
              for(var k=0;k<Q.length;k++){ window.ans[k] = '测试答案'; }
              document.title='TEST:before-submit';
              window.doSubmit();
              document.title='TEST:submitted';
            }catch(e){ document.title='TEST:err ' + (e && e.message); }
          }, 900);
        }catch(e){}
      }, 600);
    }
  }catch(e){}

  setTimeout(function(){
    loadExam().then(function(){
      try{ window.render && window.render(); }catch(e){}
      try{
        if(EX && EX.submitted){
          lockQuiz();
          var bt=document.getElementById('boot'); if(bt && bt.parentNode) bt.parentNode.removeChild(bt);
          var en=Number((EX.exam||{}).endAt||0), now=Date.now();
          showScore(Number(EX.score||0), Number(EX.ts||Date.now()), !(en===0 || now<=en));
          return;
        }
      }catch(e){}
      showCover();
    }).catch(function(){ try{ window.render && window.render(); }catch(e){} showCover(); });
  }, 250);
})();
</script>
</body>
</html>
