<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Knowlib 试卷</title>
<link rel="stylesheet" href="katex/katex.inline.css">
<script src="katex/katex.min.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --fg:#111114; --fg2:#6e6e73; --line:#00000014;
  --accent:#0A84FF; --soft:#0A84FF14; --ok:#34C759; --okbg:#34C75918; --no:#FF453A; --nobg:#FF453A18;
  --shadow:0 4px 18px #0000000d;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e0f12; --card:#1c1c1f; --fg:#f2f2f5; --fg2:#9a9aa0; --line:#ffffff1f;
        --soft:#0A84FF22; --okbg:#34C75922; --nobg:#FF453A22; --shadow:0 4px 18px #00000040;}
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"HarmonyOS Sans SC","PingFang SC","Microsoft YaHei UI","Microsoft YaHei",sans-serif;
  font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:11px 22px;
  display:flex;align-items:center;gap:14px}
.topbar .t{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .meta{font-size:12.5px;color:var(--fg2);white-space:nowrap}
.topbar .sp{flex:1}
.layout{display:flex;align-items:flex-start;gap:22px;max-width:1180px;margin:0 auto;padding:20px 22px 40px}
main{flex:1 1 auto;min-width:0}
aside{flex:0 0 244px;width:244px;position:sticky;top:64px;align-self:flex-start}

.stage{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 28px 18px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:440px}
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chip{font-size:12px;color:#7C5CFF;background:#7C5CFF18;border-radius:999px;padding:3px 11px;font-weight:600}
.qno{margin-left:auto;font-size:12.5px;color:var(--fg2)}
.stem{font-size:18px;line-height:1.9;word-break:break-word;flex:0 0 auto}
.stem code{background:var(--soft);border-radius:4px;padding:1px 5px;font-size:.94em}
.opts{margin-top:14px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border:1px solid var(--line);
   border-radius:12px;margin:9px 0;cursor:pointer;transition:.12s;background:transparent}
.opt:hover{background:var(--soft);border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--fg2);min-width:1.3em}
.opt.picked{border-color:var(--accent);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.no{border-color:var(--no);background:var(--nobg)}
.opt .mark{margin-left:auto;font-size:13px;font-weight:700}
.opt.ok .mark{color:var(--ok)} .opt.no .mark{color:var(--no)}
textarea.draft{width:100%;min-height:90px;margin-top:14px;border:1px solid var(--line);border-radius:12px;
  background:var(--bg);color:var(--fg);padding:12px 14px;font:inherit;font-size:15px;resize:vertical}
.ansbox{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px;display:none}
.ansbox.on{display:block}
.ansbox .lab{font-size:12px;color:var(--fg2);margin:0 0 4px}
.ansbox .val{font-size:17px;color:var(--accent);font-weight:600;word-break:break-word}
.ansbox .ana{font-size:15px;color:var(--fg);margin-top:10px;line-height:1.85}

.foot{display:flex;align-items:center;gap:10px;margin-top:auto;padding-top:18px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:9px 16px;font-size:14px;font-weight:600;
  background:var(--accent);color:#fff;cursor:pointer;font-family:inherit}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.btn.nav{min-width:96px}
.foot .sp{flex:1}

aside .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;
  box-shadow:var(--shadow)}
aside h3{margin:0 0 11px;font-size:13.5px;color:var(--fg2);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gbtn{aspect-ratio:1/1;border:1px solid var(--line);border-radius:10px;background:transparent;
  color:var(--fg2);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.12s}
.gbtn:hover{border-color:var(--accent);color:var(--accent)}
.gbtn.done{background:var(--accent);border-color:var(--accent);color:#fff}
.gbtn.right{background:#34C759;border-color:#34C759;color:#fff}
.gbtn.wrong{background:#FF453A;border-color:#FF453A;color:#fff}
.gbtn.cur{box-shadow:0 0 0 2px var(--accent) inset}
.legend{font-size:12px;color:var(--fg2);margin-top:12px;line-height:1.9}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:middle}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3D7EFF,#7C5CFF);transition:width .25s}
.katex{font-size:1.02em}
.katex-display{margin:.45em 0}
</style>
</head>
<body>
<div class="topbar">
  <div class="t" id="ttl">试卷</div>
  <div class="meta" id="meta"></div>
  <div class="sp"></div>
  <div class="meta" id="prog">已答 0 / 0</div>
</div>

<div class="layout">
  <main>
    <div class="stage" id="stage"></div>
  </main>
  <aside>
    <div class="card">
      <h3>答题卡</h3>
      <div class="grid" id="grid"></div>
      <div class="progress"><i id="bar"></i></div>
      <div class="legend">
        <div><span class="dot" style="background:var(--accent)"></span>已答</div>
        <div><span class="dot" style="background:#34C759"></span>答对　<span class="dot" style="background:#FF453A"></span>答错</div>
        <div><span class="dot" style="background:transparent;border:1px solid var(--line)"></span>未答</div>
      </div>
    </div>
  </aside>
</div>

<script>
window.__KLPC__ = 1;
var DATA = window.__KLDATA__ || {title:'试卷', total:0, questions:[]};
var QS = DATA.questions || [];
var picked = {};   // n -> key
var shown  = {};   // n -> true（看过答案）
var cur = 0;

function esc(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function renderMathSeg(tex, display){
  try{ return katex.renderToString(tex, {throwOnError:false, displayMode:!!display, output:'htmlAndMathml'}); }
  catch(e){ return esc(tex); }
}
function textPart(t){
  if(!t) return '';
  var h = esc(t);
  h = h.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  h = h.replace(/\r?\n\r?\n/g, '<br><br>');
  h = h.replace(/\r?\n/g, '<br>');
  return h;
}
function md(src){
  var s = String(src == null ? '' : src);
  var out = [], last = 0, m;
  var re = /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^$\n]+?)\$/g;
  while((m = re.exec(s))){
    out.push(textPart(s.slice(last, m.index)));
    if(m[1] != null || m[2] != null){
      out.push(renderMathSeg((m[1] != null ? m[1] : m[2]).trim(), true));
    }else{
      out.push(renderMathSeg((m[3] != null ? m[3] : m[4]).trim(), false));
    }
    last = m.index + m[0].length;
  }
  out.push(textPart(s.slice(last)));
  return out.join('');
}
function optsOf(q){
  var o = q.options || [];
  if((!o || !o.length) && String(q.type || '').toLowerCase() === 'judge'){
    return [{label:'对', text:'正确'}, {label:'错', text:'错误'}];
  }
  return o;
}
function correctKey(q){
  var a = String(q.answer || '').trim(), t = String(q.type || '').toLowerCase();
  if(t === 'judge'){
    if(/^(对|正确|√|T|t|true|True|是|1)$/.test(a)) return '对';
    if(/^(错|错误|×|x|X|F|f|false|False|否|0)$/.test(a)) return '错';
    return '';
  }
  var m = a.match(/^\s*([A-Ha-h])/);
  return m ? m[1].toUpperCase() : '';
}

function answerHTML(q){
  var a = String(q.answer == null ? '' : q.answer).trim() || '（这道题没给答案）';
  var s = String(q.analysis || '').trim();
  var h = '<div class="lab">参考答案</div><div class="val">' + md(a) + '</div>';
  if(s) h += '<div class="lab" style="margin-top:12px">解析</div><div class="ana">' + md(s) + '</div>';
  return h;
}

function render(){
  var q = QS[cur];
  var opts = optsOf(q);
  var h = '';
  h += '<div class="qhead"><span class="chip">' + esc(q.typeName || q.type || '题目') + '</span>';
  h += '<span class="qno">第 ' + (cur + 1) + ' / ' + QS.length + ' 题 · ' + (Number(q.score) || 0) + ' 分</span></div>';
  h += '<div class="stem">' + md(q.stem) + '</div>';
  if(opts.length){
    h += '<div class="opts">' + opts.map(function(o){
      var k = String(o.label || '').toUpperCase();
      return '<div class="opt" data-k="' + esc(k) + '"><span class="k">' + esc(k) + '.</span>'
           + '<span class="tx">' + md(o.text) + '</span><span class="mark"></span></div>';
    }).join('') + '</div>';
  }else{
    h += '<textarea class="draft" placeholder="在这里作答（可选）"></textarea>';
  }
  h += '<div class="ansbox" id="ansbox"></div>';
  h += '<div class="foot">';
  h += '<button class="btn ghost nav" id="prev"' + (cur === 0 ? ' disabled' : '') + '>← 上一题</button>';
  h += '<button class="btn ghost nav" id="next"' + (cur === QS.length - 1 ? ' disabled' : '') + '>下一题 →</button>';
  h += '<span class="sp"></span>';
  h += '<button class="btn ghost" id="showans">看答案</button>';
  h += '<button class="btn" id="saveq">＋ 加入题库</button>';
  h += '</div>';
  document.getElementById('stage').innerHTML = h;
  paintPicked();
  if(shown[cur]){ var b = document.getElementById('ansbox'); b.innerHTML = answerHTML(q); b.classList.add('on'); }
  document.getElementById('prev').onclick = function(){ go(cur - 1); };
  document.getElementById('next').onclick = function(){ go(cur + 1); };
  document.getElementById('showans').onclick = function(){
    var b = document.getElementById('ansbox');
    if(b.classList.contains('on')){ b.classList.remove('on'); return; }
    b.innerHTML = answerHTML(q); b.classList.add('on'); shown[cur] = true; refreshGrid();
  };
  document.getElementById('saveq').onclick = function(ev){
    var btn = ev.target;
    btn.disabled = true; btn.textContent = '已加入 ✓'; btn.classList.add('ghost');
    location.hash = 'klsave:' + cur;
  };
  document.querySelectorAll('#stage .opt').forEach(function(el){
    el.onclick = function(){ pick(el.getAttribute('data-k')); };
  });
  refreshGrid();
}

function paintPicked(){
  var q = QS[cur], right = correctKey(q), k = picked[cur];
  document.querySelectorAll('#stage .opt').forEach(function(el){
    el.classList.remove('picked','ok','no');
    var kk = el.getAttribute('data-k'), mark = el.querySelector('.mark');
    if(mark) mark.textContent = '';
    if(k != null && kk === k) el.classList.add('picked');
    if(right && k != null){
      if(kk === right){ el.classList.add('ok'); if(mark) mark.textContent = '✓'; }
      else if(kk === k){ el.classList.add('no'); if(mark) mark.textContent = '✕'; }
    }
  });
}

function pick(k){
  picked[cur] = k;
  paintPicked();
  if(correctKey(QS[cur])){
    var b = document.getElementById('ansbox');
    b.innerHTML = answerHTML(QS[cur]); b.classList.add('on'); shown[cur] = true;
  }
  refreshGrid();
}

function go(n){
  if(n < 0 || n >= QS.length) return;
  cur = n;
  render();
  window.scrollTo({top:0, behavior:'smooth'});
}

function state(n){
  var q = QS[n], right = correctKey(q), k = picked[n];
  if(k != null && right) return (k === right) ? 'right' : 'wrong';
  if(k != null || shown[n]) return 'done';
  return '';
}

function refreshGrid(){
  var grid = document.getElementById('grid');
  grid.innerHTML = QS.map(function(q, n){
    var st = state(n);
    return '<button class="gbtn ' + st + (n === cur ? ' cur' : '') + '" data-jump="' + n + '">' + (n+1) + '</button>';
  }).join('');
  grid.querySelectorAll('[data-jump]').forEach(function(b){
    b.onclick = function(){ go(Number(b.getAttribute('data-jump'))); };
  });
  var done = 0;
  for(var n = 0; n < QS.length; n++){ if(state(n)) done++; }
  document.getElementById('prog').textContent = '已答 ' + done + ' / ' + QS.length;
  document.getElementById('bar').style.width = (QS.length ? done * 100 / QS.length : 0) + '%';
}

(function init(){
  var ttl = (DATA.title || '试卷').replace(/^Knowlib\s*试卷\s*/, '');
  document.getElementById('ttl').textContent = ttl || '试卷';
  document.title = ttl || '试卷';
  var total = DATA.total || QS.reduce(function(a,q){ return a + (Number(q.score)||0); }, 0);
  document.getElementById('meta').textContent = '共 ' + QS.length + ' 题 · ' + total + ' 分';
  if(!QS.length){ document.getElementById('stage').innerHTML = '<div class="stem">这份试卷是空的。</div>'; return; }
  render();
})();

document.addEventListener('keydown', function(e){
  if(e.key === 'ArrowLeft') go(cur - 1);
  if(e.key === 'ArrowRight') go(cur + 1);
});
</script>
</body>
</html>
